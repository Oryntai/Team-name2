<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контроль качества — Dynamics 365 (макет)</title>
  <link rel="stylesheet" href="css/cqa.css">
  <script type="module" src="js/d365.js"></script>
  <style>
    /* Макет оболочки Dynamics 365 Customer Service. Экраны внутри — те же веб-компоненты продукта, без правок. */
    .d365 { margin: 0; background: #faf9f8; color: #323130;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .d365 svg { flex: none; }
    .d365-top { position: sticky; top: 0; z-index: 30; height: 48px; display: flex; align-items: center; gap: 14px;
      padding: 0 14px 0 0; background: #002050; color: #fff; }
    .d365-waffle { width: 48px; height: 48px; display: grid; place-items: center; color: #fff; }
    .d365-product { font-size: 16px; font-weight: 600; white-space: nowrap; }
    .d365-divider { width: 1px; height: 20px; background: rgba(255, 255, 255, .35); }
    .d365-app { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .d365-top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .d365-mock { padding: 2px 8px; border: 1px solid rgba(255, 255, 255, .45); border-radius: 2px; font-size: 12px; white-space: nowrap; }
    .d365-roles { display: flex; border: 1px solid rgba(255, 255, 255, .5); border-radius: 2px; overflow: hidden; }
    .d365-roles button { background: transparent; color: #fff; border: 0; padding: 5px 10px; font: inherit; cursor: pointer; }
    .d365-roles button[aria-pressed="true"] { background: #fff; color: #002050; font-weight: 600; }
    .d365-avatar { width: 32px; height: 32px; border-radius: 50%; background: #c7e0f4; color: #002050;
      display: grid; place-items: center; font-weight: 600; font-size: 13px; }

    .d365-shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: calc(100vh - 48px); }
    .d365-sitemap { position: sticky; top: 48px; height: calc(100vh - 48px); overflow: auto; display: flex; flex-direction: column;
      background: #f3f2f1; border-right: 1px solid #edebe9; padding: 6px 0; }
    .d365-group { padding: 14px 16px 6px; font-size: 12px; font-weight: 600; color: #605e5c; }
    .d365-sitemap a { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 13px; color: #323130; text-decoration: none;
      font-size: 14px; border-left: 3px solid transparent; }
    .d365-sitemap a:hover { background: #e1dfdd; }
    .d365-sitemap a[aria-current="page"] { background: #fff; border-left-color: #0078d4; font-weight: 600; }
    .d365-sitemap a svg, .d365-cmd svg, .d365-section-title svg { width: 16px; height: 16px; }
    .d365-badge { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 10px; background: #0078d4; color: #fff;
      font-size: 12px; line-height: 20px; text-align: center; font-weight: 600; }
    .d365-area { margin-top: auto; border-top: 1px solid #edebe9; padding: 12px 16px; font-size: 13px; color: #605e5c; }
    .d365-area b { display: block; color: #323130; font-weight: 600; }

    .d365-main { min-width: 0; display: flex; flex-direction: column; }
    .d365-cmdbar { position: sticky; top: 48px; z-index: 20; display: flex; gap: 2px; align-items: center; min-height: 44px;
      padding: 0 12px; background: #fff; border-bottom: 1px solid #edebe9; flex-wrap: wrap; }
    .d365-cmd { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; background: transparent;
      color: #323130; font: inherit; font-size: 14px; border-radius: 2px; text-decoration: none; cursor: pointer; }
    .d365-cmd:hover { background: #f3f2f1; }
    .d365-cmd svg { color: #0078d4; }
    .d365-page { padding: 16px 20px 32px; min-width: 0; }
    .d365-viewhead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin: 2px 0 14px; }
    .d365-viewhead h1 { margin: 0; font-size: 20px; font-weight: 600; color: #201f1e; }
    .d365-viewhead span { color: #605e5c; font-size: 13px; }

    .d365-formhead { background: #fff; border: 1px solid #edebe9; border-bottom: 0; border-radius: 4px 4px 0 0; padding: 16px 20px 10px;
      display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: center; justify-content: space-between; }
    .d365-entity { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .d365-entity-icon { width: 40px; height: 40px; border-radius: 50%; background: #0078d4; color: #fff; display: grid; place-items: center; }
    .d365-entity-icon svg { width: 20px; height: 20px; }
    .d365-entity h1 { margin: 0; font-size: 20px; font-weight: 600; color: #201f1e; word-break: break-all; }
    .d365-sub { font-size: 13px; color: #605e5c; }
    .d365-headfields { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0; }
    .d365-headfields dt, .d365-fields dt { font-size: 12px; color: #605e5c; }
    .d365-headfields dd, .d365-fields dd { margin: 2px 0 0; font-size: 14px; font-weight: 600; color: #201f1e; }
    .d365-tabs { display: flex; gap: 22px; padding: 0 20px; background: #fff; border: 1px solid #edebe9; border-top: 0;
      border-radius: 0 0 4px 4px; }
    .d365-tabs button { border: 0; background: transparent; padding: 10px 0 8px; font: inherit; font-size: 14px; color: #323130;
      cursor: pointer; border-bottom: 2px solid transparent; }
    .d365-tabs button[aria-selected="true"] { border-bottom-color: #0078d4; font-weight: 600; }
    .d365-tabpanel { margin-top: 16px; min-width: 0; }
    .d365-section-title { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #605e5c; margin: 0 0 10px; }
    .d365-surface { background: #fff; border: 1px solid #edebe9; border-radius: 4px; padding: 16px 20px; }
    .d365-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 24px; margin: 0; }
    .d365-note { margin: 18px 0 0; font-size: 13px; line-height: 1.5; background: #f3f2f1; border-left: 3px solid #0078d4; padding: 10px 14px; }
    .d365 code { font-family: SFMono-Regular, Consolas, Menlo, monospace; font-size: 12px; background: #fff; padding: 1px 4px;
      border: 1px solid #edebe9; border-radius: 2px; }

    @media (max-width: 900px) {
      .d365-shell { grid-template-columns: minmax(0, 1fr); }
      .d365-sitemap { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 0; border-right: 0;
        border-bottom: 1px solid #edebe9; }
      .d365-group, .d365-area, .d365-mock, .d365-app, .d365-divider { display: none; }
      .d365-sitemap a { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
      .d365-sitemap a[aria-current="page"] { border-bottom-color: #0078d4; }
      .d365-cmdbar { top: 0; position: static; }
      .d365-page { padding: 12px 16px 24px; }
    }
  </style>
</head>
<body class="d365">
  <header class="d365-top" data-part="top"></header>
  <div class="d365-shell">
    <nav class="d365-sitemap" aria-label="Карта разделов" data-part="sitemap"></nav>
    <main class="d365-main">
      <div class="d365-cmdbar" role="toolbar" aria-label="Команды" data-part="cmd"></div>
      <div class="d365-page" data-part="page"></div>
    </main>
  </div>
</body>
</html>
